# Beads Configuration File
# This file configures default behavior for all bd commands in this repository
# All settings can also be set via environment variables (BD_* prefix)
# or overridden with command-line flags

dolt.auto-start: false
# Server-mode connection to this repo's per-repo beads/Dolt TENANT on the
# shared dolt-server. Committable: carries NO per-machine project_id and NO
# password (the tenant password is supplied via BEADS_DOLT_PASSWORD at
# bd-call time). Mirrors the .livespec.jsonc livespec-impl-beads.connection
# block. TCP-only (no socket: the dolt socket dir is 0750 dolt:dolt).
dolt.mode: server
dolt.server-host: 127.0.0.1
dolt.server-port: 3307
dolt.server-user: livespec-driver-codex
dolt.database: livespec-driver-codex
dolt.prefix: livespec-driver-codex
# Client-side auto-backup lane OFF. This tenant is backed up SERVER-SIDE every
# hour by dolt-backup.service, which calls DOLT_BACKUP('sync','s3') for every
# database on the shared dolt-server, so the client lane would duplicate a
# backup that already runs. Without this explicit key bd auto-enables the lane
# whenever the repository has a git remote (isBackupAutoEnabled in
# cmd/bd/backup_auto.go) and tries to register a `backup_export` remote, which
# the server denies to the DB-scoped tenant user (Error 1105) BY DESIGN —
# tenant accounts do not get the global DOLT_BACKUP privilege that
# registration needs. The lane is therefore disabled here rather than granted
# privileges; do not "fix" the denial with a grant.
backup.enabled: false
